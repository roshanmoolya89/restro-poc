version: "3.8"

services:
  backend:
    container_name: kitchenspurs-backend
    build: ./backend
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/vendor
    depends_on:
      - db

  frontend:
    container_name: kitchenspurs-frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - "./frontend:/app"
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
  db:
    image: mysql:8.0
    container_name: kitchenspurs-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kitchenspurs-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
